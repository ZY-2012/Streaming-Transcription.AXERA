<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>真流式实时转写 · 端到端说话人分离 + ASR 演示</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--border:#e4e9f0;--ink:#1c2333;--muted:#7c8698;--accent:#2563eb}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:20px 24px 32px;background:linear-gradient(180deg,#f8fafc,#eef2f7);color:var(--ink);min-height:100vh}
h1{font-size:19px;margin:0 0 14px;display:flex;align-items:center;gap:10px;font-weight:700}
h1 .sub{font-size:12.5px;color:var(--muted);font-weight:500;background:#fff;border:1px solid var(--border);padding:3px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
#controls{padding:12px 14px}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:9px;color:#fff;font-size:14.5px;font-weight:600;padding:8px 20px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(.93)}
.btn:disabled{background:#c8cfd9 !important;cursor:not-allowed;box-shadow:none}
#startBtn{background:linear-gradient(180deg,#22b455,#16a34a)}
#stopBtn{background:linear-gradient(180deg,#e04444,#dc2626)}
#upBtn{background:linear-gradient(180deg,#fff,#f1f5f9);color:#334155;box-shadow:inset 0 0 0 1px var(--border);padding:8px 14px}
.sep{width:1px;height:26px;background:var(--border);margin:0 2px}
label{font-size:13.5px;color:var(--muted)}
select{font-size:13.5px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink)}
select:focus{outline:2px solid #bfdbfe;border-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-size:13.5px}
#status{margin-left:auto;font-size:13px;background:#f1f5f9;border:1px solid var(--border);padding:5px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:#94a3b8;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#params{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px}
#params summary{cursor:pointer;font-size:13.5px;color:var(--accent);font-weight:600;user-select:none;list-style:none;display:inline-flex;align-items:center;gap:6px}
#params summary::-webkit-details-marker{display:none}
#params summary::before{content:"▸";transition:transform .15s}
#params[open] summary::before{transform:rotate(90deg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px 18px;margin-top:10px}
.pitem{display:flex;flex-direction:column;gap:4px}
.pitem select{width:100%}
#stats{display:none}
canvas{width:100%;height:200px;background:#fff;border:1px solid var(--border);border-radius:12px;margin-top:12px;box-shadow:0 1px 3px rgba(16,24,40,.05)}
#feed{height:460px;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(16,24,40,.05);padding:12px 16px;font-size:14.5px;line-height:1.6;margin-top:12px}
.ln{margin:3px 0}.tm{color:var(--muted);font-size:12.5px}
.ssolid{color:#2a3346}.stail{color:#c2c9d4}
.sr-only{position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>真流式实时转写 <span class="sub">说话人标签 ~1s · 端到端流式分离 · AX650N</span></h1>
<div id="controls" class="card">
  <div id="bar">
    <button id="startBtn" class="btn">▶ 开始</button>
    <button id="stopBtn" class="btn">■ 停止</button>
    <div class="sep"></div>
    <label for="input">音频</label>
    <select id="input"><option value="vad" selected>vad_example 70s</option><option value="2p">2P 会议全片 33 分钟</option></select>
    <button id="upBtn" class="btn" title="上传任意格式音频，浏览器自动转成 16k 单声道 WAV">＋ 上传音频</button>
    <input type="file" id="upFile" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg,.aac" hidden>
    <label class="chk"><input type="checkbox" id="mute"> 静音</label>
    <span id="status" role="status" aria-live="polite">空闲</span>
  </div>
  <details id="params">
    <summary>参数设置</summary>
    <div class="pgrid">
      <div class="pitem"><label for="onset">说话人阈值</label>
        <select id="onset" title="端到端流式分离的帧概率阈值：高于该值才计入某说话人的活动区间。0.5 为模型标准值；调低更灵敏（易碎句）、调高更保守（易漏说）"><option value="0.5" selected>0.5（标准）</option><option value="0.4">0.4（灵敏）</option><option value="0.6">0.6（保守）</option></select></div>
      <div class="pitem"><label for="trail">句尾静音</label>
        <select id="trail" title="VAD 判定「一句话说完」要等的尾静音长度；越短出结果越快，太短容易把思考停顿当句尾"><option value="1">1s</option><option value="0.5" selected>0.5s</option></select></div>
      <div class="pitem"><label for="maxseg">段长上限</label>
        <select id="maxseg" title="VAD 段攒满多少秒有声就强制切段；段越短文字出得越勤"><option value="10">10s</option><option value="5">5s</option><option value="3" selected>3s</option></select></div>
      <div class="pitem"><label for="psplit">静音切分</label>
        <select id="psplit" title="段内攒够这么多秒有声后，遇到 0.3s 以上的自然停顿就成段；切点落在停顿上，比强制切分更保字"><option value="0">关</option><option value="3">3s</option><option value="2" selected>2s</option></select></div>
      <div class="pitem"><label for="preview">快字间隔</label>
        <select id="preview" title="无说话人的快速文字：每攒这么多秒有声就出一条 [起,止]: 文字，比说话人+文字快得多，但无说话人且切片处偶有糊字；说话人+文字出来后以其为准"><option value="0" selected>关</option><option value="3">3s</option><option value="2">2s</option><option value="1">1s</option></select></div>
      <div class="pitem"><label for="tick">实时文字</label>
        <select id="tick" title="固定节拍实时文本：以停顿划分「句段」（词安全切点），段内每过这么多秒就把整段重新转写一次，用连续两次一致的最长前缀当已确认文字（黑色），其余先灰色显示等下一拍确认；独白不停也能持续出字，替代「快字间隔」的暂停门控"><option value="0">关</option><option value="0.5" selected>0.5s</option><option value="0.8">0.8s</option><option value="0.5">0.5s</option><option value="1.2">1.2s</option></select></div>
      <div class="pitem"><label class="chk" style="margin-top:22px"><input type="checkbox" id="typer" checked> 同步播放（音频与文字同步）</label></div>
    </div>
  </details>
</div>
<div id="stats" class="card" aria-label="延迟统计">
  <span>播放位置 <b id="sNow">-</b></span>
  <span>说话人覆盖到 <b id="sCov">-</b></span>
  <span>说话人滞后 <b id="sLag">-</b></span>
  <span>首个预览文字 <b id="sPrev">-</b></span>
  <span>首个说话人+文字 <b id="sFirst">-</b></span>
  <span>说话人+文字平均延迟 <b id="sAvg">-</b></span>
  <span>首个实时文字 <b id="sStext">-</b></span>
</div>
<canvas id="cv" width="1400" height="200" aria-label="时间轴：说话人输出、文字、波形；红线为当前时刻"></canvas>
<div id="feed" aria-label="实时转写：文字先行显示，权威稿到达后原地对账（说话人+时间+文字）"></div>
<audio id="au" preload="auto"></audio>
<script>
const $ = id => document.getElementById(id);
const au = $('au'), cv = $('cv'), ctx = cv.getContext('2d');
const PAL = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b'];
let S = null, es = null, raf = 0, auURL = null;
function reset(){
  S = {t0:null, frozen:null, diar:[], cov:0, prev:[], fin:[], ref:[], peaks:null, pps:50,
       spk:{}, rspk:{}, firstPrev:null, firstFin:null, firstStext:null, st:null, rows:[], lats:[],
       running:false, pendingPlay:false};
  au.removeAttribute('src');   // a stale blob must never replay for the next run
  au.load();
  au.pause();
  au.dataset.ready = '';      // and no 'start' replay may auto-play it either
  const el = $('feed');
  if (el._typing) { clearTimeout(el._typing.timer); el._typing = null; }
  el._lastArrive = null; el._estGap = null;
  el.innerHTML = '';
}
function color(map, pal, id){ if(!(id in map)) map[id] = pal[Object.keys(map).length % pal.length]; return map[id]; }
function now(){ if (!S || S.t0 === null) return 0;
  return S.frozen !== null ? S.frozen : (performance.now() - S.t0) / 1000; }
function fmt(x){ return x === null || x === undefined ? '-' : x.toFixed(1) + 's'; }
function clock(x){ const m = Math.floor(x / 60), s = x - m * 60; return m + ':' + s.toFixed(1).padStart(4, '0'); }
async function loadWave(input, buf){
  try {
    buf = buf || await (await fetch('/audio?input=' + input)).arrayBuffer();
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const ab = await ac.decodeAudioData(buf);
    const d = ab.getChannelData(0), step = Math.floor(ab.sampleRate / S.pps);
    const p = new Float32Array(Math.ceil(d.length / step));
    for (let i = 0; i < p.length; i++) { let m = 0; const e = Math.min(d.length, (i + 1) * step);
      for (let j = i * step; j < e; j++) { const v = Math.abs(d[j]); if (v > m) m = v; } p[i] = m; }
    S.peaks = p; ac.close();
  } catch (e) { console.warn('waveform', e); }
}
// Typewriter line: reveal the body text char-by-char over ~1s while the
// prefix (speaker stamp / time range) shows immediately.  Purely cosmetic
// streaming - the underlying events are unchanged.
// Finish the line currently typing in this panel instantly (used when the
// next line arrives early, and on reset).
function completeTyping(el){ const t = el._typing; if (!t) return;
  clearTimeout(t.timer); t.body.textContent = t.ch.join(''); el._typing = null; }
// Typewriter line: reveal the body text char-by-char, paced to the panel's
// recent line cadence so a line usually finishes typing just before the next
// one lands; a line interrupted by the next one completes instantly instead
// of overlapping.  Purely cosmetic - the underlying events are unchanged.
function addTypedLine(el, prefix, text, cls, suffix){
  completeTyping(el);
  const div = document.createElement('div'); div.className = 'ln';
  const stamp = document.createElement('span'); stamp.className = 'tm'; stamp.innerHTML = prefix;
  const body = document.createElement('span'); body.className = cls || '';
  div.appendChild(stamp); div.appendChild(body);
  if (suffix) { const sfx = document.createElement('span'); sfx.innerHTML = suffix; div.appendChild(sfx); }
  const stick = () => { if (el.scrollTop + el.clientHeight >= el.scrollHeight - 26) el.scrollTop = el.scrollHeight; };
  el.appendChild(div); stick();
  const at = performance.now();
  const prevArrive = el._lastArrive; el._lastArrive = at;
  if (prevArrive && at - prevArrive > 120) el._estGap = at - prevArrive;  // ignore bursts
  if (!$('typer').checked || !text) { body.textContent = text; stick(); return div; }
  const ch = Array.from(text);
  const est = Math.min(6000, Math.max(600, el._estGap || 1500));
  const dur = Math.min(4500, Math.max(400, est * 0.9));  // aim to finish just before the next line
  const per = Math.max(12, dur / ch.length);
  let i = 0;
  el._typing = { body, ch, timer: 0 };
  const tick = () => { if (!el._typing || el._typing.body !== body) return;
    body.textContent = ch.slice(0, ++i).join(''); stick();
    if (i < ch.length) el._typing.timer = setTimeout(tick, per);
    else el._typing = null; };
  tick();
  return div;
}
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }
// ---- Single feed: streaming first, authoritative on arrival ----
// A row = one speech epoch (streaming) or one final segment (inserted when no
// epoch covers it).  Streaming rows reconcile IN PLACE when finals arrive:
// the row's intersecting finals are spliced in as colored text segments and
// the stamp shows every speaker of those finals, so a cross-speaker epoch
// (0.2 s pause does not always split a speaker turn) displays both labels.
function stampHTML(spks, b, e){
  let h = '';
  for (const s of spks) h += '<b style="color:' + color(S.spk, PAL, s) + '">' + esc(s) + '</b> ';
  return h + '<span>[' + clock(b) + (e === null ? '' : '–' + clock(e)) + ']</span> ';
}
function speakersOf(b, e){
  const agg = new Map();
  for (const d of S.diar) {
    const o = Math.min(e, d.e) - Math.max(b, d.b);
    if (o > 0.05) agg.set(d.spk, (agg.get(d.spk) || 0) + o);
  }
  return [...agg.entries()].sort((a, c) => c[1] - a[1]).slice(0, 2).map(x => x[0]);
}
function feedStick(){
  const el = $('feed');
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 26) el.scrollTop = el.scrollHeight;
}
function streamLine(b){
  const el = $('feed');
  completeTyping(el);
  const div = document.createElement('div'); div.className = 'ln';
  const stamp = document.createElement('span'); stamp.className = 'tm';
  stamp.textContent = '[' + clock(b) + '] ';
  const solid = document.createElement('span'); solid.className = 'ssolid';
  const tail = document.createElement('span'); tail.className = 'stail';
  div.appendChild(stamp); div.appendChild(solid); div.appendChild(tail);
  el.appendChild(div);
  const ln = { key: b, b: b, e: null, div, stamp, solid, tail, spk: null, auth: false };
  div._ln = ln; S.rows.push(ln);
  return ln;
}
function settleStream(){
  if (!S.st) return;
  const row = S.st;
  finishTyping(row);
  row.tail.textContent = '';
  if (row.e === null) row.e = now();
  S.st = null;
  renderAuthRow(row);   // authoritative finals may already be assigned to it
}
// Live (non-authoritative) row stamp: speakers from the diar timeline,
// longest-overlap first, at most two, in the [start–end] time format.  For a
// still-growing epoch e is the latest tick's end, so the range widens live.
function paintLiveStamp(ln){
  if (ln.auth || !ln.stamp || ln.e === null || ln.e <= ln.b) return;
  const spks = speakersOf(ln.b, ln.e);
  ln.spk = spks;
  ln.stamp.innerHTML = stampHTML(spks, ln.b, ln.e);
}
// Authoritative view of a row: one line per assigned final - speaker,
// [b–e], text and per-final lag, exactly the transcript format.  A
// cross-speaker epoch therefore splits into several colored lines at its
// original feed position.  Deterministic and echo-free: each final belongs
// to one row.  Active rows (S.st) are skipped - they keep streaming until
// epoch close.
function renderAuthRow(r){
  if (r === S.st) return;
  const fs = S.fin.filter(x => x._row === r).sort((a, b) => a.b - b.b);
  if (!fs.length) return;
  r.auth = true;
  r.div.className = '';            // becomes a wrapper holding one line per final
  r.div.innerHTML = '';
  for (const f of fs) {
    const c = f.spk ? color(S.spk, PAL, f.spk) : '#666';
    const line = document.createElement('div'); line.className = 'ln';
    line.innerHTML = '<span class="tm"><b style="color:' + c + '">' + esc(f.spk || '?') +
      '</b> <span>[' + clock(f.b) + '–' + clock(f.e) + ']</span> </span>' +
      '<span class="ssolid" style="color:' + c + '">' + esc(f.text) + '</span>';
    r.div.appendChild(line);
  }
  feedStick();
}
// Reconcile on every final event: legacy preview lines (tick=0) are absorbed
// by their covering final; the final is assigned to the row with the largest
// overlap (active epochs count up to now()); settled rows re-render, active
// ones re-render at their epoch close.  A final with no row inserts its own
// authoritative line in time order.
function reconcile(f){
  const ov = (a, b, c, d) => Math.max(0, Math.min(b, d) - Math.max(a, c));
  for (let i = S.rows.length - 1; i >= 0; i--) {
    const r = S.rows[i];
    if (r.pv && ov(r.b, r.e, f.b, f.e) / Math.max(0.01, r.e - r.b) >= 0.6) {
      r.div.remove(); S.rows.splice(i, 1);
    }
  }
  let best = null, bo = 0.05;
  for (const r of S.rows) {
    if (r.pv) continue;                 // preview lines are absorbed, never assigned
    const o = ov(r.b, r.e ?? now(), f.b, f.e);
    if (o > bo) { bo = o; best = r; }
  }
  if (best) { f._row = best; if (best.e !== null && best !== S.st) renderAuthRow(best); }
  else insertFinalRow(f);
  // drop superseded rows: settled epoch rows this final touched that never won
  // any final and are now >=95% covered by the (disjoint) finals shown
  // elsewhere - keeping them would duplicate their text in gray
  for (let i = S.rows.length - 1; i >= 0; i--) {
    const r = S.rows[i];
    if (r.pv || r.auth || r === S.st || r.e === null) continue;
    if (ov(r.b, r.e, f.b, f.e) <= 0.05) continue;
    const iv = [];
    for (const x of S.fin) { const a = Math.max(r.b, x.b), z = Math.min(r.e, x.e);
      if (z - a > 0.05) iv.push([a, z]); }
    iv.sort((a, b) => a[0] - b[0]);
    let cov = 0, ce = -1;
    for (const [a, z] of iv) { if (a > ce) { cov += z - a; ce = z; }
      else if (z > ce) { cov += z - ce; ce = z; } }
    if (cov / Math.max(0.01, r.e - r.b) >= 0.95) { r.div.remove(); S.rows.splice(i, 1); }
  }
}
function insertFinalRow(f){
  const el = $('feed');
  completeTyping(el);
  const div = document.createElement('div');   // wrapper; renderAuthRow fills it
  const ln = { key: f.b, b: f.b, e: f.e, div, stamp: null, solid: null, tail: null, spk: null, auth: false };
  div._ln = ln; S.rows.push(ln);
  let ref = null;
  for (const child of el.children) { const r = child._ln; if (r && r.b > f.b) { ref = child; break; } }
  el.insertBefore(div, ref);
  f._row = ln;
  renderAuthRow(ln);
  feedStick();
}
function finishTyping(ln){
  if (ln._typer) { clearTimeout(ln._typer); ln._typer = null; }
  if (ln._target !== undefined) ln.solid.textContent = ln._target;
}
// Reveal the confirmed caption char by char as partials grow it; a rewrite
// (prefix mismatch) snaps instantly so revisions never look like typing.
function typeCaption(ln, text){
  ln._target = text;
  if (ln._typer) return;
  const step = () => {
    ln._typer = null;
    if (!ln.div.isConnected) return;
    const cur = ln.solid.textContent;
    if (!ln._target.startsWith(cur)) { ln.solid.textContent = ln._target; return; }
    const backlog = ln._target.length - cur.length;
    if (backlog > 0) {
      // Speech rhythm: ~60 ms/char so typing breathes with the partial
      // cadence; accelerate only when a burst is piling up (run start,
      // reconnect replay) so the caption never lags the audio.
      const pace = backlog > 24 ? 10 : backlog > 10 ? 24 : 60;
      ln.solid.textContent = ln._target.slice(0, cur.length + 1);
      ln._typer = setTimeout(step, pace);
    }
  };
  step();
}
function onStext(ev){
  if (!S.st || S.st.key !== ev.b) { settleStream(); S.st = streamLine(ev.b); }
  if (S.firstStext === null) S.firstStext = ev.t;
  S.st.e = ev.e;               // latest tick end: the [b–e] range widens live
  typeCaption(S.st, ev.text);
  S.st.tail.textContent = ev.tail;
  paintLiveStamp(S.st);
  feedStick();
}
function onSfinal(ev){
  // The finalize path lags the audio thread by ~1 s, so by the time an
  // epoch's sfinal arrives the live caption may already show the NEXT
  // epoch.  Never touch the live line in that case (the old code settled
  // it and spawned an extra row -> duplicated/garbled feed): update the
  // already-settled row for this epoch instead.
  let row = (S.st && S.st.key === ev.b) ? S.st : null;
  if (!row) row = S.rows.find(r => r.key === ev.b && !r.pv);
  if (!row) row = streamLine(ev.b);
  if (S.firstStext === null) S.firstStext = ev.t;
  row.e = ev.e;
  finishTyping(row);
  row.solid.textContent = ev.text;
  row._target = ev.text;   // a later finishTyping must not restore stale text
  row.tail.textContent = '';
  if (row === S.st) settleStream();
  for (const r of S.rows.slice(-8)) paintLiveStamp(r);  // recent live rows only
  S.prev.push({ b: ev.b, e: ev.e });   // epoch bar on the timeline text row
  feedStick();
}
function onEvent(ev){
  if (ev.ev === 'status') { S.running = ev.running;
    $('startBtn').disabled = ev.running;
    $('status').textContent = ev.running ? (S.t0 === null ? '加载模型中… ' + ev.since + 's' : '运行中') : (S.t0 === null ? '空闲' : '已结束');
    if (!ev.running && S.t0 !== null && S.frozen === null) { au.pause(); S.frozen = now(); }
    return; }
  if (ev.ev === 'start') { S.t0 = performance.now(); au.currentTime = 0; au.muted = $('mute').checked;
    // Only play audio this page loaded for THIS run.  SSE reconnects replay
    // the whole event stream; without the guard a stale tab (server restart,
    // another client switching runs) would start playing its own leftover
    // source on top of the run - two sounds at once in the room.
    if (au.src && au.dataset.ready === '1') au.play().catch(()=>{});
    else S.pendingPlay = true;   // audio still buffering / this page is a viewer
    return; }
  if (S.t0 === null) return;
  // SSE is polled every 0.1 s: never let the page clock lag the board clock.
  if (S.frozen === null && ev.t > now()) S.t0 = performance.now() - ev.t * 1000;
  if (ev.ev === 'diar') { S.diar.push(...ev.parts.map(p => ({b:p[0], e:p[1], spk:p[2], t:ev.t}))); S.cov = Math.max(S.cov, ev.core[1]);
    for (const r of S.rows.slice(-8)) paintLiveStamp(r); }  // coverage frontier may pass recent rows late
  else if (ev.ev === 'preview') { S.prev.push(ev); if (S.firstPrev === null) S.firstPrev = ev.t;
    const div = addTypedLine($('feed'), `[${clock(ev.b)}–${clock(ev.e)}] `, ev.text);
    const ln = { key: ev.b, b: ev.b, e: ev.e, div, stamp: null, solid: null, tail: null, spk: null, auth: false, pv: true };
    div._ln = ln; S.rows.push(ln); }
  else if (ev.ev === 'stext') { onStext(ev); }
  else if (ev.ev === 'sfinal') { onSfinal(ev); }
  else if (ev.ev === 'final') { S.fin.push(ev); if (S.firstFin === null) S.firstFin = ev.t; S.lats.push(ev.t - ev.e);
    reconcile(ev); }
  else if (ev.ev === 'end') { au.pause(); if (S.frozen === null) S.frozen = ev.t;
    settleStream();
    for (const r of S.rows.slice(-8)) paintLiveStamp(r); }
}
const SPAN = 30;  // seconds visible; "now" sits at 85% of the width
function draw(){
  raf = requestAnimationFrame(draw);
  const W = cv.width, H = cv.height, n = now(), L = 90, PW = W - L;
  const x1 = n + SPAN * 0.15, x0 = x1 - SPAN, X = t => L + (t - x0) / SPAN * PW;
  ctx.clearRect(0, 0, W, H); ctx.font = '13px sans-serif';
  const rows = [['说话人输出', 10], ['文字', 70], ['波形', 130]];
  rows.forEach(([name, y]) => { ctx.fillStyle = '#444'; ctx.fillText(name, 6, y + 28); ctx.fillStyle = '#f3f3f3'; ctx.fillRect(L, y, PW, 50); });
  const bar = (b, e, y, h, c) => { const a = Math.max(X(b), L), z = Math.min(X(e), W); if (z > a) { ctx.fillStyle = c; ctx.fillRect(a, y, z - a, h); } };
  for (const d of S.diar) bar(d.b, d.e, 15, 40, color(S.spk, PAL, d.spk));
  // unlabeled gap between the coverage frontier and now
  if (n > S.cov) { ctx.fillStyle = 'rgba(0,0,0,0.08)'; const a = Math.max(X(S.cov), L); ctx.fillRect(a, 10, X(n) - a, 50);
    ctx.fillStyle = '#999'; ctx.fillText('待标注', Math.max(a + 4, L + 4), 40); }
  for (const p of S.prev) bar(p.b, p.e, 95, 18, 'rgba(120,120,120,0.35)');
  for (const f of S.fin) bar(f.b, f.e, 75, 18, f.spk ? color(S.spk, PAL, f.spk) : '#666');
  if (S.peaks) { ctx.fillStyle = '#7a8ca3'; const i0 = Math.max(0, Math.floor(x0 * S.pps)), i1 = Math.min(S.peaks.length, Math.floor(n * S.pps));
    for (let i = i0; i < i1; i++) { const h = S.peaks[i] * 48; ctx.fillRect(X(i / S.pps), 155 - h / 2, Math.max(1, PW / SPAN / S.pps), h); } }
  ctx.strokeStyle = '#3367d6'; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(X(S.cov), 4); ctx.lineTo(X(S.cov), 66); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle = '#d00'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(n), 0); ctx.lineTo(X(n), H); ctx.stroke(); ctx.lineWidth = 1;
  ctx.fillStyle = '#666';
  for (let t = Math.ceil(x0 / 5) * 5; t < x1; t += 5) if (t >= 0) ctx.fillText(clock(t), X(t) - 14, H - 4);
  $('sNow').textContent = S.t0 === null ? '-' : clock(n);
  $('sCov').textContent = S.t0 === null ? '-' : clock(S.cov);
  $('sLag').textContent = S.t0 === null ? '-' : fmt(Math.max(0, n - S.cov));
  $('sPrev').textContent = fmt(S.firstPrev); $('sFirst').textContent = fmt(S.firstFin);
  $('sStext').textContent = fmt(S.firstStext);
  $('sAvg').textContent = S.lats.length ? fmt(S.lats.reduce((a, b) => a + b, 0) / S.lats.length) : '-';
}
function connect(){
  if (es) es.close();
  es = new EventSource('/events');
  es.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn(e); } };
}
// Encode a Float32 channel as a 16-bit PCM mono WAV file.
function encodeWav(samples, rate){
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
  }
  return buf;
}
$('upBtn').onclick = () => $('upFile').click();
$('upFile').onchange = async () => {
  const f = $('upFile').files[0];
  $('upFile').value = '';
  if (!f) return;
  $('status').textContent = '解码 ' + f.name + ' …';
  try {
    const decoded = await new (window.AudioContext || window.webkitAudioContext)()
      .decodeAudioData(await f.arrayBuffer());
    const rate = 16000, len = Math.max(1, Math.ceil(decoded.duration * rate));
    const oc = new OfflineAudioContext(1, len, rate);   // decodes any input to 16k mono
    const src = oc.createBufferSource(); src.buffer = decoded; src.connect(oc.destination); src.start();
    const wav = encodeWav((await oc.startRendering()).getChannelData(0), rate);
    const label = f.name.replace(/\.[^.]*$/, '') || 'audio';
    $('status').textContent = '上传中（' + (wav.byteLength / 1048576).toFixed(1) + ' MB）…';
    const r = await fetch('/upload?name=' + encodeURIComponent(label + '.wav'), {method: 'POST', body: wav});
    const j = await r.json();
    if (!j.ok) { $('status').textContent = j.msg; return; }
    let opt = null;
    for (const o of $('input').options) if (o.value === j.key) opt = o;
    if (!opt) { opt = document.createElement('option'); opt.value = j.key; $('input').appendChild(opt); }
    opt.textContent = j.label;
    $('input').value = j.key;
    $('status').textContent = '已添加「' + j.label + '」，点「开始」运行';
  } catch (e) { console.warn(e); $('status').textContent = '无法解析该音频文件'; }
};
$('startBtn').onclick = async () => {
  const input = $('input').value; reset();
  $('status').textContent = '启动中…';
  // 1) tell the board to start FIRST: model loading begins immediately
  const startP = fetch('/start?input=' + encodeURIComponent(input) + '&onset=' + $('onset').value + '&maxseg=' + $('maxseg').value + '&psplit=' + $('psplit').value + '&preview=' + $('preview').value + '&trail=' + $('trail').value + '&tick=' + $('tick').value, {method: 'POST'})
    .then(r => r.json()).catch(() => ({ok: false, msg: '启动请求失败'}));
  // The audio download runs in parallel with /start so a large input (2P,
  // 31 MB) overlaps the pipeline's model loading instead of stacking after it.
  const audioP = fetch('/audio?input=' + encodeURIComponent(input))
    .then(r => r.arrayBuffer()).catch(e => { console.warn('audio', e); return null; });
  // 2) once /start confirms, attach SSE right away: the「加载模型中… X s」
  //    status shows while the audio is still being fetched below.
  const j = await startP;
  if (j.ok) connect();
  // 3) fetch the audio ONCE; reuse it for playback (blob) and the waveform.
  //    (The audioP below is started together with /start, so a large input's
  //    download overlaps the pipeline's model loading instead of stacking
  //    after it.)
  //    (Uploaded audio is always re-fetched: decodeAudioData detaches the
  //    ArrayBuffer we sent to the server, so the cached copy is unusable.)
  let buf = null;
  try { buf = await audioP; } catch (e) { console.warn('audio', e); }
  if (auURL) URL.revokeObjectURL(auURL);
  if (buf) {
    auURL = URL.createObjectURL(new Blob([buf], {type: 'audio/wav'}));
    au.src = auURL; au.load();
    au.dataset.ready = '1';   // only THIS page's freshly loaded audio may
                              // auto-play on the pipeline's start event
    if (S.t0 !== null) {
      // The pipeline started while the (large) audio was still fetching.
      // Play for real - the muted unlock play's pause() would otherwise
      // race this call and silence the run (2P vs vad_example difference).
      // Drop in at the current timeline position so the sound stays in
      // sync with the captions (the opening seconds are simply skipped).
      au.muted = $('mute').checked;
      try {
        const at = now();
        if (at > 0.5 && isFinite(au.duration) && at < au.duration) au.currentTime = at;
      } catch (e) { /* seek best-effort */ }
      au.play().catch(() => {});
      S.pendingPlay = false;
    } else {
      // play()+pause() inside the click keeps autoplay permission for the
      // delayed start
      au.muted = true; au.play().then(() => { if (S.t0 === null) au.pause(); }).catch(() => {});
    }
  }
  loadWave(input, buf);
  $('status').textContent = j.msg;
  // if the pipeline's start event arrived while the audio was still loading,
  // begin playback now
  if (S.pendingPlay && S.t0 !== null && au.src) { S.pendingPlay = false; au.play().catch(()=>{}); }
};
$('stopBtn').onclick = () => {
  // Pause the browser-side "microphone" immediately; the board pipeline needs
  // a few seconds to flush its final window, so /stop is fire-and-forget.
  au.pause();
  if (S.t0 !== null && S.frozen === null) S.frozen = now();
  $('status').textContent = '停止中…';
  fetch('/stop', {method: 'POST'}).then(r => r.json())
    .then(j => { $('status').textContent = j.msg; })
    .catch(() => { $('status').textContent = '停止请求失败'; });
};
$('mute').onchange = () => { au.muted = $('mute').checked; };
// Streaming text replaces the pause-gated preview path: forcing preview off
// avoids duplicated fast text (the server enforces the same rule).
$('tick').onchange = () => {
  const on = $('tick').value !== '0';
  $('preview').disabled = on;
  if (on) $('preview').value = '0';
};
$('tick').onchange(); reset(); draw();
fetch('/status').then(r => r.json()).then(s => { if (s.running) { $('status').textContent = '有任务在运行，已接入'; connect(); } });
</script>
