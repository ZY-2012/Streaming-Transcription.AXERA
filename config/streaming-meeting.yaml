# True-streaming meeting transcription demo: the end-to-end streaming
# Sortformer (Nemotron-3) owns the speaker timeline with ~1 s label latency,
# so speaker-attributed transcript lines appear as each turn stabilizes
# instead of tens of seconds later.  Run with:
#   CONFIG=config/streaming-meeting.yaml ./scripts/run-target.sh
audio:
  playback:
    device: hw:0,0
    sample_rate_hz: 48000
    channels: 2
  capture:
    device: hw:2,0
    sample_rate_hz: 48000
    channels: 2
buffers:
  period_ms: 10
  alsa_buffer_ms: 50
  application_buffer_ms: 1000
apm:
  aec:
    enabled: false
    mode: aec3
    multi_channel_render: true
    multi_channel_capture: true
  delay:
    base_ms: 0
  ns:
    enabled: true
    level: high
  agc1:
    enabled: true
    mode: fixed_digital
    target_level_dbfs: 3
    compression_gain_db: 9
    limiter: true
  agc2:
    enabled: false
    fixed_gain_db: 0.0
    adaptive_digital: true
    adaptive_headroom_db: 5.0
    adaptive_max_gain_db: 50.0
    adaptive_initial_gain_db: 15.0
    adaptive_max_gain_change_db_per_second: 6.0
    adaptive_max_output_noise_level_dbfs: -50.0
  gain_adjustment:
    enabled: true
    pre_gain_factor: 1.0
    post_gain_factor: 1.0
  high_pass_filter_enabled: true
fastenhance:
  enabled: true
  model_path: models-for-asr-chain/ns/fastenhance/fastenhance_48k.axmodel
  npu_core: 0
  monitor_enabled: false
  library: build/libfastenhance.so
vad:
  enabled: true
  model_path: models-for-asr-chain/vad/ten-vad/ten-vad.axmodel
  library: driver/vad/lib/libten_vad.so
  npu_core: 0
  input_buffer_ms: 2000
  hop_ms: 16
  threshold: 0.3
  min_speech_ms: 615
  min_segment_seconds: 1.0
  max_segment_seconds: 10.0
  preview_seconds: 0.0
  pause_split_seconds: 0.0
  stream_tick_seconds: 0.0
  stream_pause_seconds: 0.2
  stream_epoch_max_seconds: 12.0
  trailing_silence_seconds: 1.0
diarization:
  enabled: true
  logging_enabled: false
  # True-streaming engine: end-to-end Sortformer, incremental 10 ms frames.
  engine: nemotron
  nemotron:
    runner: build/stream-diar-worker
    model_dir: models-for-asr-chain/nemotron
    preset: lowlat            # ~0.8 s input buffer; offline = 30.4 s
    variant: npu2             # BIG_LITTLE 链路用 npu2 模型；npu3 仅单机 DISABLE 验证
    threads: 8
    onset: 0.5
    offset: 0.5
  # pyannote fallback fields (unused with engine: nemotron)
  mode: session
  runner: build/diar-worker
  model_path: models-for-asr-chain/pyannote
  speaker_table_path: output/speakers.json
  speaker_match_threshold: 0.55
  step_sec: 2.0
  omp_threads: 4
  session_chunk_sec: 120
  session_step_sec: 0
  session_max_wait_sec: 30
asr:
  enabled: true
  # True-streaming text track: continuous streaming SenseVoice session,
  # LocalAgreement-2 confirmed text, speakers from the diarization timeline.
  # offline = the legacy per-segment path (unchanged behaviour).
  mode: streaming
  refine: epoch              # 轮次闭合时用离线模型再识别作权威稿（final 带全标点/更少错字；字幕仍走流式 0.1s）
  streaming:
    backend: worker         # worker = 常驻真流式(协议见 docs/); http = 板载 asr_server
    runner: driver/asr/sensevoice/bin/asr_server
    worker: build/stream-asr-worker
    model_dir: models-for-asr-chain/asr
    server: http://127.0.0.1:18080
    model_name: sensevoice
    language: zh
    poll_seconds: 0.5        # 增量文本节拍（http: 增长窗口 POST; worker: partial 轮询）
    confirm: immediate        # immediate=即出即显（最快）；agreement=LA-2 稳定后再显
    epoch_cap_seconds: 12.0  # 单轮次音频上限，超过强制成段
    epoch_pause_seconds: 0.3  # 静音成段阈值：越小行越碎延迟越低，越大行越长
    label_wait_seconds: 3.0  # 轮次闭合等说话人时间线覆盖的最长时间
    split_turns: true        # 轮内文本在说话人切换处切开逐段归属（换人处无停顿时避免主导说话人吞掉整段）
    turn_shift_seconds: 0.55  # 分离时间线的换人边界前移量（流式分离模型 label 滞后约 0.5s，不前移会把下一说话人的开头词划给前一人）
  model_path: models-for-asr-chain/asr
  model_type: sensevoice
  language: zh
  library: driver/asr/sensevoice/lib/libax_asr_api.so
  npu_core: 1
  worker_threads: 1
output:
  temp_dir: output/segments
  text_file: output/transcript.txt
  mp3_dir: output/mp3
  max_mp3_storage_mb: 512
  mp3_encoder: ffmpeg
runtime:
  input: file
  input_wav: samples/vad_example.wav
  file_input_mode: realtime
  apm_binary: build/run-alsa-apm
  npu_lock_file: output/npu2.lock
  playback_enabled: false
  log_level: info
